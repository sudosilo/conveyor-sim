<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Conveyor Sim</title>
<style>
:root{--bg:#f4f2ea;--panel:#fffdf7;--ink:#22262b;--muted:#6b6f75;--line:#d9d4c4;--accent:#c4621d;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
#view{position:fixed;inset:0;touch-action:none}
.bar{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;pointer-events:none}
.chip{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.title{font-weight:700;letter-spacing:.5px}
.title span{color:var(--accent)}
.bar .sp{flex:1}
button{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;pointer-events:auto}
button.on{border-color:var(--accent);color:var(--accent)}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);max-height:48vh;overflow:auto;padding:10px 12px calc(16px + env(safe-area-inset-bottom,0px))}
#sheet.closed{display:none}
.btns{display:flex;gap:6px;flex-wrap:wrap;padding:6px 0}
.nm{font-weight:700}
.muted{color:var(--muted);font-size:12px}
input[type=range]{width:100%;accent-color:var(--accent)}
.sl{padding:6px 0}
p{margin:0 0 8px}
#status{font-size:12px}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="view"></div>
<div class="bar">
  <div class="chip title">CONVEYOR <span>SIM</span></div>
  <div class="chip" id="status">loading</div>
  <div class="sp"></div>
  <button id="bBuild" class="on">Build</button>
  <button id="bBox">Box</button>
  <button id="bRun" class="on">Running</button>
  <button id="bTop">Top</button>
  <button id="bSheet">Panel</button>
</div>
<div id="sheet"><div id="body"></div></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// Units: one world unit is one foot. Heights are stored in inches.
const IN=1/12;
const WIDTH=2,ROLLER_PITCH=3*IN,ZONE=2.5,FRAME=5*IN;
const BOX_L=16*IN,BOX_W=12*IN,BOX_H=10*IN,GAP=4*IN;
const INK=new THREE.Color('#22262b'),ACC=new THREE.Color('#c4621d'),MOTOR=new THREE.Color('#1f6f8b'),LEG=new THREE.Color('#8a8f96');
const HEAD={0:'east',90:'north',180:'west',270:'south'};
const KEY='conveyor-sim-v1';

const state={mode:'build',len:10,heading:0,running:true,sel:null,sections:[],boxes:[],nextId:1};

const view=document.getElementById('view');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.setClearColor(0xf4f2ea,1);
view.appendChild(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.1,2000);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.maxPolarAngle=Math.PI*0.495;controls.maxDistance=400;
scene.add(new THREE.GridHelper(120,120,0xd9d4c4,0xe9e5d8));
const lineMat=new THREE.LineBasicMaterial({vertexColors:true});
const boxGeo=new THREE.EdgesGeometry(new THREE.BoxGeometry(BOX_L,BOX_H,BOX_W));boxGeo.translate(0,BOX_H/2,0);
const boxMat=new THREE.LineBasicMaterial({color:0x2f6b3a});

const byId=(id)=>state.sections.find(s=>s.id===id);
const toV=(p)=>new THREE.Vector3(p[0],p[1],-p[2]);
function geo(s){const t=s.heading*Math.PI/180,dx=Math.round(Math.cos(t)*1e6)/1e6,dy=Math.round(Math.sin(t)*1e6)/1e6;return {dx,dy,nx:-dy,ny:dx,ax:s.x,ay:s.y,bx:s.x+dx*s.len,by:s.y+dy*s.len,h0:s.h0*IN,h1:(s.h0+s.rise)*IN};}
function pt(s,g,along,side,up){const h=g.h0+(g.h1-g.h0)*along/s.len;return [g.ax+g.dx*along+g.nx*side,h+up,g.ay+g.dy*along+g.ny*side];}

// Drawing: every conveyor is one set of plain lines.
const drawn=new Map();
function buildSection(s){
  const g=geo(s),pos=[],col=[],sel=state.sel===s.id,L=s.len,w=WIDTH/2;
  const seg=(a,b,c)=>{const A=toV(a),B=toV(b);const k=sel&&c!==MOTOR?ACC:c;pos.push(A.x,A.y,A.z,B.x,B.y,B.z);col.push(k.r,k.g,k.b,k.r,k.g,k.b);};
  for(const sd of [-w,w]){
    seg(pt(s,g,0,sd,0),pt(s,g,L,sd,0),INK);
    seg(pt(s,g,0,sd,-FRAME),pt(s,g,L,sd,-FRAME),INK);
    seg(pt(s,g,0,sd,0),pt(s,g,0,sd,-FRAME),INK);
    seg(pt(s,g,L,sd,0),pt(s,g,L,sd,-FRAME),INK);
  }
  const motors=new Set();
  for(let z=0;z*ZONE<L-0.01;z++){const c=Math.min(L,(z+0.5)*ZONE);motors.add(Math.round((c-ROLLER_PITCH/2)/ROLLER_PITCH));}
  for(let i=0,a=ROLLER_PITCH/2;a<L;i++,a+=ROLLER_PITCH){
    if(motors.has(i)){
      seg(pt(s,g,a-0.4*IN,-w,-0.5*IN),pt(s,g,a-0.4*IN,w,-0.5*IN),MOTOR);
      seg(pt(s,g,a+0.4*IN,-w,-0.5*IN),pt(s,g,a+0.4*IN,w,-0.5*IN),MOTOR);
      const o=w+4*IN;
      seg(pt(s,g,a-1.5*IN,w,-1*IN),pt(s,g,a-1.5*IN,o,-1*IN),MOTOR);
      seg(pt(s,g,a+1.5*IN,w,-1*IN),pt(s,g,a+1.5*IN,o,-1*IN),MOTOR);
      seg(pt(s,g,a-1.5*IN,o,-1*IN),pt(s,g,a+1.5*IN,o,-1*IN),MOTOR);
    }else seg(pt(s,g,a,-w,-0.5*IN),pt(s,g,a,w,-0.5*IN),INK);
  }
  const legs=[0.5,L-0.5];if(L>6)legs.push(L/2);
  for(const a of legs){
    const top=[pt(s,g,a,-w,-FRAME),pt(s,g,a,w,-FRAME)];
    const foot=top.map(p=>[p[0],0,p[2]]);
    seg(top[0],foot[0],LEG);seg(top[1],foot[1],LEG);
    const b0=[foot[0][0],0.5,foot[0][2]],b1=[foot[1][0],0.5,foot[1][2]];
    seg(b0,b1,LEG);seg(b0,top[1],LEG);
  }
  if(s.dir){
    for(let z=0;z*ZONE<L-0.01;z++){
      const c=Math.min(L-0.5,(z+0.5)*ZONE),d=0.35*s.dir;
      seg(pt(s,g,c-d,-0.45,0.4*IN),pt(s,g,c+d,0,0.4*IN),ACC);
      seg(pt(s,g,c-d,0.45,0.4*IN),pt(s,g,c+d,0,0.4*IN),ACC);
    }
  }else{
    const c=L/2;
    seg(pt(s,g,c-0.15,-0.4,0.4*IN),pt(s,g,c-0.15,0.4,0.4*IN),ACC);
    seg(pt(s,g,c+0.15,-0.4,0.4*IN),pt(s,g,c+0.15,0.4,0.4*IN),ACC);
  }
  const geom=new THREE.BufferGeometry();
  geom.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  geom.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  return new THREE.LineSegments(geom,lineMat);
}
function redraw(){
  for(const o of drawn.values()){scene.remove(o);o.geometry.dispose();}
  drawn.clear();
  for(const s of state.sections){const o=buildSection(s);scene.add(o);drawn.set(s.id,o);}
  for(const b of state.boxes){const s=byId(b.sec);if(s)b.s=Math.max(0,Math.min(s.len,b.s));}
  save();updateStatus();
}

// Boxes ride the conveyors. A box stops at a dead end or behind another box.
function placeBox(b){
  const s=byId(b.sec);if(!s)return;const g=geo(s);
  b.obj.position.copy(toV(pt(s,g,b.s,0,0)));
  b.obj.rotation.order='YZX';
  b.obj.rotation.set(0,s.heading*Math.PI/180,Math.atan2(g.h1-g.h0,s.len));
}
const U=(b,t)=>t.dir>0?b.s:t.len-b.s;
function exitOf(s){const g=geo(s);return s.dir>0?{x:g.bx,y:g.by,h:g.h1}:{x:g.ax,y:g.ay,h:g.h0};}
function conn(s){
  const e=exitOf(s);
  for(const t of state.sections){
    if(t===s||!t.dir)continue;const g=geo(t);
    const n=t.dir>0?{x:g.ax,y:g.ay,h:g.h0}:{x:g.bx,y:g.by,h:g.h1};
    if(Math.hypot(n.x-e.x,n.y-e.y)<0.5&&Math.abs(n.h-e.h)<3*IN)return t;
  }
  return null;
}
function step(dt){
  if(!state.running)return;
  const moved=new Set(),pitch=BOX_L+GAP;
  for(const s of state.sections){
    if(!s.dir)continue;
    const list=state.boxes.filter(b=>b.sec===s.id&&!moved.has(b)).sort((a,b)=>U(b,s)-U(a,s));
    if(!list.length)continue;
    const T=conn(s),v=s.fpm/60*dt;
    let ahead;
    if(T){const on=state.boxes.filter(b=>b.sec===T.id).map(b=>U(b,T));ahead=s.len+(on.length?Math.min(...on):Infinity);}
    else ahead=s.len-BOX_L/2+pitch;
    for(const b of list){
      const u=U(b,s);let nu=Math.min(u+v,ahead-pitch);if(nu<u)nu=u;
      if(T&&nu>=s.len){const over=nu-s.len;b.sec=T.id;b.s=T.dir>0?over:T.len-over;moved.add(b);}
      else b.s=s.dir>0?nu:s.len-nu;
      ahead=nu;
    }
  }
}
function dropBox(s){
  const at=s.dir>0?BOX_L/2:s.dir<0?s.len-BOX_L/2:s.len/2;
  if(state.boxes.some(b=>b.sec===s.id&&Math.abs(b.s-at)<BOX_L+GAP)){flash('No room at the start of that conveyor yet');return;}
  const obj=new THREE.LineSegments(boxGeo,boxMat);scene.add(obj);
  const b={sec:s.id,s:at,obj};state.boxes.push(b);placeBox(b);updateStatus();
}
function clearBoxes(id){state.boxes=state.boxes.filter(b=>{if(id==null||b.sec===id){scene.remove(b.obj);return false;}return true;});updateStatus();}

// Placing: tap open floor for a new piece, or tap near an open end to add on to it.
function endTaken(x,y,own){return state.sections.some(t=>{if(t===own)return false;const g=geo(t);return Math.hypot(g.ax-x,g.ay-y)<0.3||Math.hypot(g.bx-x,g.by-y)<0.3;});}
function place(x,y){
  let sx=Math.round(x),sy=Math.round(y),hd=state.heading,h0=30,dir=1,best=null;
  for(const s of state.sections){
    const g=geo(s);
    const ends=[{x:g.bx,y:g.by,h:s.h0+s.rise,hd:s.heading,dir:s.dir||1},{x:g.ax,y:g.ay,h:s.h0,hd:(s.heading+180)%360,dir:-(s.dir||1)}];
    for(const e of ends){const d=Math.hypot(e.x-x,e.y-y);if(d<2&&!endTaken(e.x,e.y,s)&&(!best||d<best.d))best=Object.assign({d},e);}
  }
  if(best){sx=best.x;sy=best.y;hd=best.hd;h0=best.h;dir=best.dir;}
  const s={id:state.nextId++,x:sx,y:sy,heading:hd,len:state.len,h0,rise:0,dir,fpm:60};
  state.sections.push(s);state.sel=s.id;redraw();renderPanel();
}

const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
function rayAt(e){const r=renderer.domElement.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-(e.clientY-r.top)/r.height*2+1);ray.setFromCamera(ndc,camera);return ray.ray;}
function hitPlane(r,h){const p=new THREE.Vector3();return r.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),-h),p)?{x:p.x,y:-p.z,d:p.distanceTo(r.origin)}:null;}
function pickSection(r){
  let best=null;
  for(const s of state.sections){
    const g=geo(s),p=hitPlane(r,(g.h0+g.h1)/2);if(!p)continue;
    const rx=p.x-g.ax,ry=p.y-g.ay,a=rx*g.dx+ry*g.dy,sd=rx*g.nx+ry*g.ny;
    if(a>-0.3&&a<s.len+0.3&&Math.abs(sd)<WIDTH/2+0.4&&(!best||p.d<best.d))best={s,d:p.d};
  }
  return best&&best.s;
}
function tap(e){
  const r=rayAt(e),hit=pickSection(r);
  if(state.mode==='box'){if(hit)dropBox(hit);return;}
  if(hit){state.sel=hit.id;redraw();renderPanel();return;}
  if(state.sel!==null){state.sel=null;redraw();renderPanel();return;}
  const f=hitPlane(r,0);if(f)place(f.x,f.y);
}
let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY,t:performance.now()};});
renderer.domElement.addEventListener('pointerup',e=>{if(!down)return;const m=Math.hypot(e.clientX-down.x,e.clientY-down.y),dt=performance.now()-down.t;down=null;if(m<8&&dt<500)tap(e);});

// Panel
const body=document.getElementById('body');
function renderPanel(){
  const s=state.sel!=null&&byId(state.sel);
  if(s){
    body.innerHTML=`<p><span class="nm">Conveyor ${s.id}</span> <span class="muted">powered roller, two way, ${s.len} ft, facing ${HEAD[s.heading]}</span></p>
    <div class="btns"><button data-dir="1" class="${s.dir===1?'on':''}">Forward</button><button data-dir="-1" class="${s.dir===-1?'on':''}">Reverse</button><button data-dir="0" class="${s.dir===0?'on':''}">Stop</button></div>
    <div class="sl">Speed <span id="spv">${s.fpm}</span> ft per min<input type="range" id="sp" min="20" max="150" step="5" value="${s.fpm}"></div>
    <div class="sl">Start height <span id="h0v">${s.h0}</span> in<input type="range" id="h0" min="6" max="72" step="1" value="${s.h0}"></div>
    <div class="sl">Rise <span id="rv">${s.rise}</span> in, end height <span id="h1v">${s.h0+s.rise}</span> in<input type="range" id="ri" min="-24" max="24" step="1" value="${s.rise}"></div>
    <div class="btns"><button data-len="5" class="${s.len===5?'on':''}">5 ft</button><button data-len="10" class="${s.len===10?'on':''}">10 ft</button><button id="turn">Turn</button><button id="del">Delete</button><button id="done">Done</button></div>`;
    body.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{s.dir=+b.dataset.dir;redraw();renderPanel();});
    body.querySelectorAll('[data-len]').forEach(b=>b.onclick=()=>{s.len=+b.dataset.len;redraw();renderPanel();});
    body.querySelector('#sp').oninput=e=>{s.fpm=+e.target.value;body.querySelector('#spv').textContent=s.fpm;save();};
    body.querySelector('#h0').oninput=e=>{s.h0=+e.target.value;if(s.h0+s.rise<6)s.rise=6-s.h0;body.querySelector('#h0v').textContent=s.h0;body.querySelector('#h1v').textContent=s.h0+s.rise;body.querySelector('#rv').textContent=s.rise;body.querySelector('#ri').value=s.rise;redraw();};
    body.querySelector('#ri').oninput=e=>{s.rise=Math.max(+e.target.value,6-s.h0);body.querySelector('#rv').textContent=s.rise;body.querySelector('#h1v').textContent=s.h0+s.rise;redraw();};
    body.querySelector('#turn').onclick=()=>{s.heading=(s.heading+90)%360;redraw();renderPanel();};
    body.querySelector('#del').onclick=()=>{clearBoxes(s.id);state.sections=state.sections.filter(x=>x!==s);state.sel=null;redraw();renderPanel();};
    body.querySelector('#done').onclick=()=>{state.sel=null;redraw();renderPanel();};
  }else if(state.mode==='box'){
    body.innerHTML=`<p>Tap a conveyor to drop a box on it.</p><p class="muted">Boxes ride the way the conveyor runs. When two conveyor ends meet at the same height, the box passes to the next one. At a dead end the box waits, and boxes behind it stop with a gap.</p><div class="btns"><button id="cb">Clear boxes</button></div>`;
    body.querySelector('#cb').onclick=()=>clearBoxes(null);
  }else{
    body.innerHTML=`<p><span class="nm">Piece:</span> powered roller conveyor, two way</p><p class="muted">Tap open floor to place one. Tap near the open end of a conveyor to add on to it at the same height. Tap a conveyor to change it.</p>
    <div class="btns"><button data-len="5" class="${state.len===5?'on':''}">5 ft</button><button data-len="10" class="${state.len===10?'on':''}">10 ft</button><button id="hd">Facing ${HEAD[state.heading]}</button><button id="clr">Clear all</button></div>`;
    body.querySelectorAll('[data-len]').forEach(b=>b.onclick=()=>{state.len=+b.dataset.len;renderPanel();});
    body.querySelector('#hd').onclick=()=>{state.heading=(state.heading+90)%360;renderPanel();};
    body.querySelector('#clr').onclick=()=>{clearBoxes(null);state.sections=[];state.sel=null;redraw();renderPanel();};
  }
}
function setMode(m){state.mode=m;state.sel=null;document.getElementById('bBuild').classList.toggle('on',m==='build');document.getElementById('bBox').classList.toggle('on',m==='box');document.getElementById('sheet').classList.remove('closed');redraw();renderPanel();}
document.getElementById('bBuild').onclick=()=>setMode('build');
document.getElementById('bBox').onclick=()=>setMode('box');
document.getElementById('bRun').onclick=e=>{state.running=!state.running;e.target.classList.toggle('on',state.running);e.target.textContent=state.running?'Running':'Paused';};
document.getElementById('bTop').onclick=()=>{const t=controls.target;camera.position.set(t.x,60,t.z+0.01);};
document.getElementById('bSheet').onclick=()=>document.getElementById('sheet').classList.toggle('closed');

let flashUntil=0;
function flash(msg){document.getElementById('status').textContent=msg;flashUntil=performance.now()+2000;}
function updateStatus(){if(performance.now()<flashUntil)return;document.getElementById('status').textContent=state.sections.length+' conveyors, '+state.boxes.length+' boxes';}
function save(){try{localStorage.setItem(KEY,JSON.stringify({sections:state.sections,nextId:state.nextId}));}catch(e){}}
function loadSaved(){try{const j=JSON.parse(localStorage.getItem(KEY)||'null');if(j&&Array.isArray(j.sections)){state.sections=j.sections;state.nextId=j.nextId||1;}}catch(e){}}

addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
controls.target.set(5,1,0);camera.position.set(22,20,24);
const clock=new THREE.Clock();let tick=0;
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),0.1);step(dt);for(const b of state.boxes)placeBox(b);if(++tick%30===0)updateStatus();controls.update();renderer.render(scene,camera);}
loadSaved();redraw();renderPanel();loop();
</script>
</body>
</html>
